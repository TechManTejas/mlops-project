apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'parking-detector'
        static_configs:
          - targets: ['parking-detector-app:3000']
        metrics_path: '/metrics'
        scrape_interval: 5s
