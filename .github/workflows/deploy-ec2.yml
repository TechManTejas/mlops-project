name: Deploy To EC2

on:
  push:
    branches:
      - main
    paths:
      - "config/model_config.yaml"
      - "src/**"
      - "Dockerfile"
      - "requirements.txt"
      - "docker-compose.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.EC2_DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            dvc pull
            docker compose down
            # Remove problematic certbot directories that cause permission issues
            sudo rm -rf certbot/conf/accounts certbot/conf/renewal certbot/conf/live/.gitignore || true
            # Fix permission issues before building
            sudo chown -R $USER:$USER . || true
            docker compose up -d --build
